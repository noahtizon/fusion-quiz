<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION Personality Quiz Results</title>
    <link rel="icon" type="image/png" href="fusion-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="quiz-container">
        <!-- Results Screen (dynamically populated) -->
        <div id="results-screen" class="screen active">
            <div class="results-container">
                <div class="result-header">
                    <div class="result-icon" id="result-icon"></div>
                    <h1 id="result-title"></h1>
                    <p id="result-subtitle"></p>
                </div>
                
                <div class="result-description">
                    <p id="result-description-text"></p>
                </div>

                <div class="programs-section">
                    <h3>Recommended Programs</h3>
                    <div class="programs-list" id="programs-list"></div>
                    <p class="programs-note">Ask a board member about any of these programs!</p>
                </div>

                <div class="share-section">
                    <button class="share-btn" onclick="shareResult()">Share Your Result</button>
                    <button class="retake-btn" onclick="goToQuiz()">Retake Quiz</button>
                    <a href="https://forms.gle/hBdjBUDi3K4vG9kv8" target="_blank" class="interest-form-btn">Interest Form</a>
                </div>

                <div class="all-types-section">
                    <button class="dropdown-toggle" id="dropdown-toggle-btn">
                        <span>Explore All Types</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div class="all-types-dropdown" id="all-types-dropdown">
                        <div class="all-types-grid" id="all-types-grid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="credit">Made by Noah Tizon</div>

    <script src="data.js"></script>
    <script>

        // Get archetype from URL path
        function getArchetypeFromUrl() {
            const path = window.location.pathname;
            const archetype = path.split('/')[1]; // Gets 'builder', 'networker', etc.
            return archetype in archetypes ? archetype : null;
        }

        // Populate the results page
        function populateResults(archetype) {
            const data = archetypes[archetype];
            if (!data) return false;

            // Update page title
            document.title = `${data.title} - FUSION Personality Quiz`;

            // Populate content
            document.getElementById('result-icon').textContent = data.icon;
            document.getElementById('result-title').textContent = data.title;
            document.getElementById('result-subtitle').textContent = data.subtitle;
            document.getElementById('result-description-text').textContent = data.description;

            // Populate programs
            const programsList = document.getElementById('programs-list');
            programsList.innerHTML = '';
            data.programs.forEach(program => {
                const span = document.createElement('span');
                span.className = 'program-tag';
                span.textContent = program;
                programsList.appendChild(span);
            });

            // Populate all types
            const allTypesGrid = document.getElementById('all-types-grid');
            allTypesGrid.innerHTML = '';
            
            console.log('Populating all types grid...'); // Debug log
            
            const createTypeCard = (key, data) => {
                const card = document.createElement('div');
                card.className = key === archetype ? 'all-type-card current' : 'all-type-card';
                card.onclick = () => window.location.href = `/${key}`;
                card.innerHTML = `<div class="all-type-icon">${data.icon}</div><div class="all-type-title">${data.title}</div>`;
                console.log('Created card for:', key, data.title); // Debug log
                return card;
            };
            
            const entries = Object.entries(archetypes);
            console.log('Archetype entries:', entries); // Debug log
            
            const firstRow = document.createElement('div');
            const secondRow = document.createElement('div');
            
            firstRow.className = 'all-types-row first-row';
            secondRow.className = 'all-types-row second-row';
            
            entries.slice(0, 3).forEach(([key, data]) => firstRow.appendChild(createTypeCard(key, data)));
            entries.slice(3, 5).forEach(([key, data]) => secondRow.appendChild(createTypeCard(key, data)));
            
            allTypesGrid.append(firstRow, secondRow);
            console.log('All types grid populated with', allTypesGrid.children.length, 'rows'); // Debug log

            // Set for sharing
            window.lastResult = {
                title: data.title,
                subtitle: data.subtitle
            };

            return true;
        }

        // Initialize page
        window.addEventListener('DOMContentLoaded', function() {
            const archetype = getArchetypeFromUrl();
            if (!archetype || !populateResults(archetype)) {
                // Invalid archetype, redirect to main quiz
                window.location.href = '/';
            }
            
            // Add event listener for dropdown toggle
            const dropdownToggle = document.getElementById('dropdown-toggle-btn');
            if (dropdownToggle) {
                dropdownToggle.addEventListener('click', toggleAllTypes);
                console.log('Dropdown toggle event listener added'); // Debug log
            } else {
                console.error('Dropdown toggle button not found'); // Debug log
            }
        });

        function goToQuiz() {
            window.location.href = '/';
        }

        function shareResult() {
            if (navigator.share && window.lastResult) {
                navigator.share({
                    title: 'My FUSION Personality Quiz Result',
                    text: `I'm ${window.lastResult.title}! Take the quiz at https://fusion-quiz.vercel.app/`,
                    url: window.location.href
                }).catch(console.error);
            } else {
                // Fallback: copy to clipboard
                const shareText = `I just took the FUSION Personality Quiz and I'm "${window.lastResult.title}!" \n\nTake the quiz at https://fusion-quiz.vercel.app/`;
                
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareText).then(() => {
                        alert('Result copied to clipboard! Share it with your friends!');
                    }).catch(() => {
                        fallbackCopyToClipboard(shareText);
                    });
                } else {
                    fallbackCopyToClipboard(shareText);
                }
            }
        }

        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                alert('Result copied to clipboard! Share it with your friends!');
            } catch (err) {
                alert('Unable to copy to clipboard. Please manually copy your result to share!');
            }
            
            document.body.removeChild(textArea);
        }

        // Toggle dropdown function
        function toggleAllTypes() {
            console.log('toggleAllTypes called'); // Debug log
            const dropdown = document.getElementById('all-types-dropdown');
            const arrow = document.querySelector('.dropdown-arrow');
            
            console.log('dropdown element:', dropdown); // Debug log
            console.log('arrow element:', arrow); // Debug log
            
            if (!dropdown || !arrow) {
                console.error('Dropdown or arrow element not found');
                return;
            }
            
            // Simple toggle approach
            const isCurrentlyVisible = dropdown.style.display === 'block';
            
            console.log('isCurrentlyVisible:', isCurrentlyVisible); // Debug log
            console.log('current display:', dropdown.style.display); // Debug log
            
            if (isCurrentlyVisible) {
                dropdown.style.display = 'none';
                arrow.textContent = '▼';
            } else {
                dropdown.style.display = 'block';
                arrow.textContent = '▲';
            }
            
            console.log('new display:', dropdown.style.display); // Debug log
        }

        // Make functions globally available for inline onclick handlers
        window.goToQuiz = goToQuiz;
        window.shareResult = shareResult;
    </script>
</body>
</html>
