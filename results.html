<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4c900">
  <title>My FUSION Archetype</title>
  <link rel="icon" type="image/png" href="fusion-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell result-shell">
    <header class="brand-bar">
      <a class="brand" href="/"><img src="fusion-logo.png" alt="" class="brand-logo"><span>FUSION @ UCI</span></a>
      <span class="year-pill">YOUR ARCHETYPE</span>
    </header>

    <section class="result-hero">
      <p class="overline">YOUR FUSION ARCHETYPE IS</p>
      <div id="result-icon" class="result-icon"></div>
      <h1 id="result-title"></h1>
      <p id="result-subtitle" class="result-subtitle"></p>
    </section>

    <section class="result-grid">
      <article class="result-about">
        <p class="section-label">ABOUT YOUR ARCHETYPE</p>
        <p id="result-description-text"></p>
      </article>
      <article class="starter-card">
        <p class="section-label">PROGRAMS TO CHECK OUT</p>
        <div id="programs-list" class="programs-list"></div>
        <p class="booth-prompt"><strong>Show your result to someone at the booth</strong><br>and we can tell you more about these programs.</p>
      </article>
    </section>

    <div class="result-actions">
      <button id="share-btn" class="primary-btn" type="button">Share my archetype ↗</button>
      <a class="secondary-btn" href="/">Retake quiz</a>
    </div>

    <details class="all-types-section">
      <summary>See all five FUSION archetypes <span>+</span></summary>
      <div id="all-types-grid" class="all-types-grid"></div>
    </details>
  </main>
  <footer class="site-footer"><span>Filipinx Undergraduate Scientist-Engineers</span><span>Made by Noah Tizon</span></footer>

  <script src="data.js"></script>
  <script>
    const key = window.location.pathname.split('/')[1];
    const data = archetypes[key];
    if (!data) window.location.replace('/');
    else {
      document.title = `${data.title} · FUSION @ UCI`;
      document.getElementById('result-icon').textContent = data.icon;
      document.getElementById('result-title').textContent = data.title;
      document.getElementById('result-subtitle').textContent = data.subtitle;
      document.getElementById('result-description-text').textContent = data.description;
      const list = document.getElementById('programs-list');
      data.programs.forEach((program, i) => {
        const item = document.createElement('div');
        item.className = 'program-row';
        item.innerHTML = `<span>0${i + 1}</span><strong>${program}</strong>`;
        list.appendChild(item);
      });
      const all = document.getElementById('all-types-grid');
      Object.entries(archetypes).forEach(([type, info]) => {
        const a = document.createElement('a');
        a.href = `/${type}`;
        a.className = `type-chip ${type === key ? 'current' : ''}`;
        a.innerHTML = `<span>${info.icon}</span>${info.title.replace('The ', '')}`;
        all.appendChild(a);
      });
    }

    document.getElementById('share-btn').addEventListener('click', async () => {
      const shareData = { title: `I'm ${data.title}!`, text: `I got ${data.title} on the FUSION @ UCI personality quiz.`, url: window.location.href };
      try {
        if (navigator.share) await navigator.share(shareData);
        else if (navigator.clipboard) { await navigator.clipboard.writeText(window.location.href); document.getElementById('share-btn').textContent = 'Link copied ✓'; }
      } catch (_) {}
    });
  </script>
</body>
</html>
