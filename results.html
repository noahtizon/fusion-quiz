<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION Personality Quiz Results</title>
    <link rel="icon" type="image/png" href="fusion-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="quiz-container">
        <!-- Results Screen (dynamically populated) -->
        <div id="results-screen" class="screen active">
            <div class="results-container">
                <div class="result-header">
                    <div class="result-icon" id="result-icon"></div>
                    <h1 id="result-title"></h1>
                    <p id="result-subtitle"></p>
                </div>
                
                <div class="result-description">
                    <p id="result-description-text"></p>
                </div>

                <div class="programs-section">
                    <h3>Recommended Programs</h3>
                    <div class="programs-list" id="programs-list"></div>
                    <p class="programs-note">Links to specific programs will be available soon!</p>
                </div>

                <div class="other-types-section">
                    <h3>Explore All Types</h3>
                    <div class="other-types-grid" id="other-types-grid"></div>
                </div>

                <div class="share-section">
                    <button class="share-btn" onclick="shareResult()">Share Your Result</button>
                    <button class="retake-btn" onclick="goToQuiz()">Retake Quiz</button>
                </div>
            </div>
        </div>
    </div>

    <div class="credit">Made by Noah Tizon</div>

    <script type="module">
        // Import archetype data
        import { archetypes } from './data.js';

        // Get archetype from URL path
        function getArchetypeFromUrl() {
            const path = window.location.pathname;
            const archetype = path.split('/')[1]; // Gets 'builder', 'networker', etc.
            return archetype in archetypes ? archetype : null;
        }

        // Populate the results page
        function populateResults(archetype) {
            const data = archetypes[archetype];
            if (!data) return false;

            // Update page title
            document.title = `${data.title} - FUSION Personality Quiz`;

            // Populate content
            document.getElementById('result-icon').textContent = data.icon;
            document.getElementById('result-title').textContent = data.title;
            document.getElementById('result-subtitle').textContent = data.subtitle;
            document.getElementById('result-description-text').textContent = data.description;

            // Populate programs
            const programsList = document.getElementById('programs-list');
            programsList.innerHTML = '';
            data.programs.forEach(program => {
                const span = document.createElement('span');
                span.className = 'program-tag';
                span.textContent = program;
                programsList.appendChild(span);
            });

            // Populate other types (exclude current archetype)
            const otherTypesGrid = document.getElementById('other-types-grid');
            otherTypesGrid.innerHTML = '';
            
            Object.entries(archetypes).forEach(([key, archetypeData]) => {
                if (key !== archetype) { // Don't show current archetype
                    const typeCard = document.createElement('div');
                    typeCard.className = 'other-type-card';
                    typeCard.onclick = () => window.location.href = `/${key}`;
                    
                    typeCard.innerHTML = `
                        <div class="other-type-icon">${archetypeData.icon}</div>
                        <div class="other-type-title">${archetypeData.title}</div>
                        <div class="other-type-subtitle">${archetypeData.subtitle}</div>
                    `;
                    
                    otherTypesGrid.appendChild(typeCard);
                }
            });

            // Set for sharing
            window.lastResult = {
                title: data.title,
                subtitle: data.subtitle
            };

            return true;
        }

        // Initialize page
        window.addEventListener('DOMContentLoaded', function() {
            const archetype = getArchetypeFromUrl();
            if (!archetype || !populateResults(archetype)) {
                // Invalid archetype, redirect to main quiz
                window.location.href = '/';
            }
        });

        function goToQuiz() {
            window.location.href = '/';
        }

        function shareResult() {
            if (navigator.share && window.lastResult) {
                navigator.share({
                    title: 'My FUSION Personality Quiz Result',
                    text: `I'm ${window.lastResult.title}! Take the quiz at https://fusion-quiz.vercel.app/`,
                    url: window.location.href
                }).catch(console.error);
            } else {
                // Fallback: copy to clipboard
                const shareText = `I just took the FUSION Personality Quiz and I'm "${window.lastResult.title}!" \n\nTake the quiz at https://fusion-quiz.vercel.app/`;
                
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareText).then(() => {
                        alert('Result copied to clipboard! Share it with your friends!');
                    }).catch(() => {
                        fallbackCopyToClipboard(shareText);
                    });
                } else {
                    fallbackCopyToClipboard(shareText);
                }
            }
        }

        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                alert('Result copied to clipboard! Share it with your friends!');
            } catch (err) {
                alert('Unable to copy to clipboard. Please manually copy your result to share!');
            }
            
            document.body.removeChild(textArea);
        }

        // Make functions globally available for inline onclick handlers
        window.goToQuiz = goToQuiz;
        window.shareResult = shareResult;
    </script>
</body>
</html>
