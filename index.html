<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION Personality Quiz</title>
    <link rel="icon" type="image/png" href="fusion-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="logo-container">
                <img src="fusion-logo.png" alt="FUSION Logo" class="fusion-logo" onerror="this.style.display='none';">
            </div>
            <h1>Which FUSION Archetype Are You?</h1>
            <p class="subtitle">Take this personality quiz to discover your perfect FUSION programs!</p>
            <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-text" id="progress-text">Question 1 of 7</span>
            </div>
            
            <div class="question-container">
                <h2 id="question-text"></h2>
                <div class="answers-container" id="answers-container">
                    <!-- Answers will be populated by JavaScript -->
                </div>
                <div class="quiz-navigation">
                    <button class="back-btn" id="back-btn" onclick="goBack()" style="display: none;">← Back</button>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <div class="results-container">
                <div class="result-header">
                    <div class="result-icon" id="result-icon"></div>
                    <h1 id="result-title"></h1>
                    <p id="result-subtitle"></p>
                </div>
                
                <div class="result-description">
                    <p id="result-description-text"></p>
                </div>

                <div class="programs-section">
                    <h3>Recommended Programs</h3>
                    <div class="programs-list" id="programs-list">
                        <!-- Programs will be populated by JavaScript -->
                    </div>
                    <p class="programs-note">Links to specific programs will be available soon!</p>
                </div>

                <div class="share-section">
                    <button class="share-btn" onclick="shareResult()">Share Your Result</button>
                    <button class="retake-btn" onclick="retakeQuiz()">Retake Quiz</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Credit -->
    <div class="credit">Made by Noah Tizon</div>

    <script src="script.js"></script>
</body>
</html>
