<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4c900">
  <title>What's Your FUSION Archetype?</title>
  <link rel="icon" type="image/png" href="fusion-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="photo-styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="brand-bar">
      <a class="brand" href="/" aria-label="FUSION quiz home">
        <img src="fusion-logo.png" alt="" class="brand-logo">
        <span>FUSION @ UCI</span>
      </a>
    </header>
    <section id="start-screen" class="screen active start-screen">
      <div class="start-copy"><h1>Find your place <span>in FUSION.</span></h1><p class="lede">Answer three questions to find your FUSION archetype and programs to check out.</p></div>
      <div class="start-art" aria-hidden="true"><div class="orbit orbit-one"><span>🔧</span><span>📚</span><span>🎉</span></div><div class="orbit orbit-two"><span>🤝</span><span>❤️</span></div><div class="center-mark"><img src="fusion-logo.png" alt=""></div></div>
      <button id="start-btn" class="primary-btn start-btn" type="button">Find my FUSION archetype <span>→</span></button>
    </section>
    <section id="quiz-screen" class="screen quiz-screen" aria-live="polite"><div class="progress-row"><button id="back-btn" class="text-btn" type="button">← Back</button><div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div><span id="progress-text" class="progress-text">1 / 3</span></div><div class="question-wrap"><p id="question-eyebrow" class="overline"></p><h2 id="question-text"></h2><div id="answers-container" class="answers-container"></div></div></section>
    <section id="lesson-screen" class="screen lesson-screen" aria-live="polite"><button id="skip-lesson" class="lesson-card lesson-card-photo" type="button" aria-label="Continue to next question"><div class="lesson-photo-wrap"><img id="lesson-photo" class="lesson-photo" src="" alt="" decoding="async"></div><div class="lesson-content"><div class="lesson-number" id="lesson-icon"></div><div class="lesson-copy"><p id="lesson-kicker" class="overline"></p><h2 id="lesson-title"></h2><p id="lesson-body"></p></div><div class="lesson-footer"><span>FUSION PROGRAM</span><span>Tap to continue →</span></div></div><div id="lesson-timer" class="lesson-timer"></div></button></section>
    <section id="reveal-screen" class="screen reveal-screen" aria-live="polite"><p class="overline">YOUR RESULT</p><h2>Finding your<br>FUSION archetype<span class="dots">...</span></h2><div class="signal-row"><span>YOU</span><i></i><span>FUSION</span></div></section>
  </main>
  <footer class="site-footer"><span>Filipinx Undergraduate Scientist-Engineers in an Organized Network</span><span>Made by Noah Tizon</span></footer>
  <script src="data.js"></script><script src="script.js"></script>
</body>
</html>
