<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION Personality Quiz</title>
    <link rel="icon" type="image/png" href="fusion-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="logo-container">
                <img src="fusion-logo.png" alt="FUSION Logo" class="fusion-logo" onerror="this.style.display='none';">
            </div>
            <h1>Which FUSION Archetype Are You?</h1>
            <p class="subtitle">Take this personality quiz to discover your perfect FUSION programs!</p>
            <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
            <a href="https://forms.gle/hBdjBUDi3K4vG9kv8" target="_blank" class="interest-form-btn homepage-btn">Fill out our interest form! 
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
            </a>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-text" id="progress-text">Question 1 of 5</span>
            </div>
            
            <div class="question-container">
                <h2 id="question-text"></h2>
                <div class="answers-container" id="answers-container">
                    <!-- Answers will be populated by JavaScript -->
                </div>
                <div class="quiz-navigation">
                    <button class="back-btn" id="back-btn" onclick="goBack()" style="display: none;">← Back</button>
                </div>
            </div>
        </div>


    </div>

    <div class="credit">Made by Noah Tizon</div>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
